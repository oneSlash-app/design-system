# Checks every pull request and every push to main: the Node package
# (tests, contrast, committed dist/ and native/ output up to date) and the
# Swift package (build, test, iOS simulator test), and the Android library (build, test, gallery).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npm test

      - run: npm run check:contrast

      - name: Build and check committed output is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist native)" ]; then
            git status --porcelain dist native
            echo "::error::dist/ or native/ is out of date. Run npm run build and commit."
            exit 1
          fi

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - run: swift build

      - run: swift test

      # The iOS run is the one that exercises the Increase Contrast trait: macOS only builds its
      # high-contrast appearance while that system setting is on.
      - name: Test on an iOS simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          TEST_RUNNER_ODS_GALLERY_DIR="$RUNNER_TEMP/parts-gallery" xcodebuild test -scheme OneSlashDesign -destination "platform=iOS Simulator,id=$id"

      # Every part in every theme and appearance, to look at. Not compared pixel by pixel:
      # system rendering changes between OS versions and must not break the build.
      - uses: actions/upload-artifact@v7
        with:
          name: parts-gallery
          path: ${{ runner.temp }}/parts-gallery
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Builds the library, runs its tests and renders the gallery: real Material components
      # and the oneSlash parts in every theme and appearance. The images are for looking at,
      # not compared pixel by pixel.
      - name: Build, test and render the gallery
        env:
          ODS_GALLERY_DIR: ${{ runner.temp }}/android-gallery
        run: ./gradlew :oneslash-design:assembleRelease :oneslash-design:testDebugUnitTest

      - uses: actions/upload-artifact@v7
        with:
          name: android-gallery
          path: ${{ runner.temp }}/android-gallery
          if-no-files-found: error

# Releases a new version when package.json's version changes on main:
# publishes to npm, creates tag v<version> plus a GitHub Release with notes
# generated from the PRs merged since the previous release, then tells the
# docs repo (oneSlash-app/design-system-docs) to bump to the new version.
#
# To release: bump "version" in package.json, run `npm run build`, merge to
# main. Run it by hand from the Actions tab to (re)try an untagged version.
# Nothing happens if tag v<version> already exists.
#
# Secrets:
#   NPM_TOKEN            npm automation token with publish rights (omit if
#                        npm trusted publishing is configured for this repo)
#   DOCS_DISPATCH_TOKEN  fine-grained PAT, repo design-system-docs,
#                        permission "Contents: read and write"
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write # create tag and GitHub Release
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check for a new version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Build and check committed dist is up to date
        if: steps.version.outputs.skip != 'true'
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "::error::dist/ is out of date. Run npm run build and commit before releasing."
            exit 1
          fi

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "oneslash-design-system@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version already on npm, skipping publish."
          else
            npm publish --provenance --access public
          fi

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Notify docs repo
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/oneSlash-app/design-system-docs/dispatches \
            -f event_type=design-system-released \
            -f "client_payload[version]=${{ steps.version.outputs.version }}"

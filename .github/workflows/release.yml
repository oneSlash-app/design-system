# Publishes to npm when a GitHub Release is published, then tells the docs
# repo (oneSlash-app/design-system-docs) to bump to the new version.
#
# To release: bump "version" in package.json, run `npm run build`, merge to
# main, then create a GitHub Release with tag v<version> (e.g. v1.5.0).
#
# Secrets:
#   NPM_TOKEN            npm automation token with publish rights (omit if
#                        npm trusted publishing is configured for this repo)
#   DOCS_DISPATCH_TOKEN  fine-grained PAT, repo design-system-docs,
#                        permission "Contents: read and write"
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Release tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build and check committed dist is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "::error::dist/ is out of date. Run npm run build and commit before releasing."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "oneslash-design-system@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version already on npm, skipping publish."
          else
            npm publish --provenance --access public
          fi

      - name: Notify docs repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/oneSlash-app/design-system-docs/dispatches \
            -f event_type=design-system-released \
            -f "client_payload[version]=${{ steps.version.outputs.version }}"
